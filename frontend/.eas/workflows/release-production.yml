# Native lane: build both platform binaries, then publish an OTA update to the
# `production` channel. Triggered by `release-native/*` tags
# (e.g. release-native/1.0.0). Build jobs read env from the eas.json
# `production` profile's `environment` field.
name: Native release production

on:
  push:
    tags: ['release-native/*']

jobs:
  test:
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run unit tests
        run: npm test -- --watchAll=false --ci --passWithNoTests
  build_android:
    needs: [test]
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    needs: [test]
    type: build
    params:
      platform: ios
      profile: production
  update:
    needs: [build_android, build_ios]
    type: update
    environment: production
    params:
      channel: production
      message: ${{ github.ref_name }}
