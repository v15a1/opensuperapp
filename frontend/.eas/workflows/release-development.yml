# Native lane: build both platform binaries, then publish an OTA update to the
# `development` channel. Triggered by `dev-native/*` tags (e.g. dev-native/1.0.0).
# Build jobs read their env from the eas.json `development` profile's
# `environment` field — there is no job-level `environment:` on a build job.
name: Native release development

on:
  push:
    tags: ['dev-native/*']

jobs:
  test:
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run unit tests
        run: npm test -- --watchAll=false --ci --passWithNoTests
  # `platform: all` is not valid for a build job, so the two platforms are
  # separate jobs that run in parallel after tests pass.
  build_android:
    needs: [test]
    type: build
    params:
      platform: android
      profile: development
  build_ios:
    needs: [test]
    type: build
    params:
      platform: ios
      profile: development
  update:
    needs: [build_android, build_ios]
    type: update
    environment: development
    params:
      channel: development
      message: ${{ github.ref_name }}
