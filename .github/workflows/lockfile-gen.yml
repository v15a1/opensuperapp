# TEMPORARY — regenerate package-lock.json on Linux so it matches what the CI
# runner's `npm ci` expects (platform-gated optional deps like @emnapi/* that
# don't resolve on macOS). Uploads the result as an artifact to download and
# commit, then this file is deleted. Triggers only when this file is pushed.
name: lockfile-gen

on:
  push:
    branches: [v1]
    paths: ['.github/workflows/lockfile-gen.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json
